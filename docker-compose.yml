services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: natural-reader-postgres
    environment:
      POSTGRES_USER: natural_reader
      # Override in a .env file / shell for anything past a local dev box.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-natural_reader}
      POSTGRES_DB: natural_reader
    ports:
      # Bound to 127.0.0.1 (SEC-5): the backend is the only client. Publishing
      # on all interfaces exposes Postgres (and its creds) to the whole LAN.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a FRESH data volume (docker-entrypoint-initdb.d semantics):
      # prepares the schema Keycloak stores its realm in.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natural_reader"]
      interval: 5s
      timeout: 3s
      retries: 10
    # always, not unless-stopped: podman-restart.service (./startup.sh
    # enable-autostart) only restarts restart-policy=always containers after a
    # reboot. `./startup.sh stop` removes containers, so this never overrides a
    # deliberate stop.
    restart: always

  searxng:
    image: searxng/searxng:latest   # pin to a dated tag for reproducibility
    container_name: natural-reader-searxng
    ports:
      # Bound to 127.0.0.1 — the FastAPI backend is the ONLY client; the browser
      # never talks to SearXNG. Publishing on all interfaces would expose an
      # unauthenticated open search proxy. Non-default host port (18043) also
      # dodges the perpetually-busy 8080. Change it? Update SEARXNG_URL to match.
      - "127.0.0.1:18043:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:18043/
    restart: always

  # Local-dev OIDC identity provider. NOT production: start-dev runs without
  # TLS and ships bootstrap admin creds (production Keycloak — TLS, HA, dedicated
  # DB credentials — is sub-project D). Realm state lives in the shared Postgres
  # (schema "keycloak", created by deploy/postgres/init/) so identities — and
  # their oidc sub UUIDs — survive container recreation. --import-realm only
  # seeds the realm when it does not already exist. With the old embedded H2 the
  # store died with the container and every recreate minted NEW sub UUIDs,
  # desyncing the app's users.oidc_sub rows (409 "email already linked to
  # another identity").
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: natural-reader-keycloak
    # Keycloak refuses an empty KC_PROXY_HEADERS ("Expected values are:
    # forwarded, xforwarded") and restarts forever, and ${KC_PROXY_HEADERS:-}
    # below is empty unless .env sets it (a fresh clone doesn't). Drop it when
    # empty, then run kc.sh with `command` exactly as the image would.
    entrypoint:
      - /bin/bash
      - -c
      - '[ -n "$${KC_PROXY_HEADERS}" ] || unset KC_PROXY_HEADERS; exec /opt/keycloak/bin/kc.sh "$$@"'
      - kc.sh
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    depends_on:
      - postgres
    environment:
      # Console bootstrap admin (Keycloak's own admin UI at :18080/admin).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/natural_reader
      KC_DB_USERNAME: natural_reader
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-natural_reader}
      KC_DB_SCHEMA: keycloak
      # Behind a TLS-terminating reverse proxy (e.g. nginx at https://auth.example.com)
      # Keycloak must trust the proxy's forwarded headers AND know its public URL,
      # or it emits http:// asset/iframe URLs that the browser blocks as mixed
      # content, and its OIDC `issuer` won't match OIDC_ISSUER. Empty by default so
      # direct localhost dev is unchanged; set both in .env for a proxied deploy:
      #   KC_PROXY_HEADERS=xforwarded
      #   KC_HOSTNAME=https://auth.example.com
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-}
      KC_HOSTNAME: ${KC_HOSTNAME:-}
    ports:
      # Non-default host port (18080) — Keycloak's default 8080 is avoided. Both
      # the browser (redirect) and the backend (discovery/token exchange) use
      # this exact URL, so they agree on the issuer. Bound to 127.0.0.1 for local
      # dev; a real deployment fronts Keycloak with a proper hostname + TLS (D).
      - "127.0.0.1:18080:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    restart: always

  # The FastAPI backend (TTS, chat, documents). Host networking: it is a client
  # of Postgres :5433, Keycloak :18080, SearXNG :18043 and Ollama :11434, all
  # bound to 127.0.0.1 on the host, and the OIDC issuer must be the same URL
  # for the browser and the backend. It still binds 127.0.0.1:8000 only (HOST).
  # Host paths come from startup.sh as NR_* variables (podman-compose fills a
  # volume's ${VAR} from this service's own environment block, so the host side
  # must never share a name with an in-container setting).
  backend:
    build:
      context: .
      dockerfile: Containerfile
      args:
        WITH_DOCLING: ${NR_WITH_DOCLING:-false}
        APP_UID: ${NR_APP_UID:-1000}
    image: natural-reader-backend:latest
    container_name: natural-reader-backend
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      DOC_STORAGE_DIR: /app/data/pdfs
      LOG_DIR: /app/logs
      LOG_AUDIT_FILE: /app/logs/audit.log
      HF_HOME: /app/.cache/huggingface
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # run.py settings: the shell's or .env's value, else run.py's default.
      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-8000}
      WORKERS: ${WORKERS:-1}
    volumes:
      - ${NR_DATA_DIR:-./data/pdfs}:/app/data/pdfs
      - ${NR_LOG_DIR:-./logs}:/app/logs
      - cache:/app/.cache
    restart: always

volumes:
  pgdata:
  cache:
