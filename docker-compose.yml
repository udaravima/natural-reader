services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: natural-reader-postgres
    environment:
      POSTGRES_USER: natural_reader
      POSTGRES_PASSWORD: natural_reader
      POSTGRES_DB: natural_reader
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natural_reader"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest   # pin to a dated tag for reproducibility
    container_name: natural-reader-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    restart: unless-stopped

volumes:
  pgdata:
