# Reference nginx site for Natural Reader — serves the built SPA and proxies the
# backend so the browser sees ONE origin (required for OIDC session cookies).
#
# This is a REFERENCE you install into your own nginx (e.g. copy to
# /etc/nginx/sites-available/ and symlink, or drop into conf.d/). Adjust
# `listen`, `server_name`, and `root` for your host; nothing here touches your
# system config automatically. `:8080` below is only a stand-in for whatever
# origin you serve the app on — keep it in sync with OIDC_REDIRECT_URL and the
# realm's redirect URIs.

server {
    listen 8080;
    server_name localhost;

    # `npm run build` output. Absolute path on your box.
    root /path/to/natural-reader/dist;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Backend API — same origin as the SPA, so the session cookie is sent.
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # TTS/chat responses can stream — don't sit on them in a proxy buffer.
        proxy_buffering off;
        # Large PDF uploads go through /v1/docs/{id}/pdf.
        client_max_body_size 100m;
    }

    # NOTE: there is deliberately NO /api/ (Ollama) location block anymore.
    # The SPA's chat runs through the authenticated /v1/inference gateway on
    # the backend above; Ollama stays backend-only (loopback bind, nothing
    # proxied). Only add an /api/ block if you deliberately run the SPA in
    # "Inference source: Local Ollama" mode against a shared daemon — and
    # then gate it (auth_basic / IP allowlist), because that path bypasses
    # the app's auth, allowlist, and budgets entirely.
}

# Optional: give Keycloak a clean hostname instead of hitting :18080 directly.
# If you use this, set OIDC_ISSUER to https://auth.example.com/realms/natural-reader
# and update the realm's redirect URIs accordingly.
